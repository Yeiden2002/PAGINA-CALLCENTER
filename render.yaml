# One public origin for SPA and API; keep the existing ead-api service.
services:
  - type: web
    name: ead-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: render
      - key: SERVE_FRONTEND
        value: "true"
      - key: VITE_API_URL
        value: /api
      - key: STORAGE_PROVIDER
        value: r2
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
